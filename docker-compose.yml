
services:
  db:
    image: pgvector/pgvector:pg17
    container_name: research-papers-db
    environment:
      POSTGRES_DB: research_papers
      POSTGRES_USER: research_papers
      POSTGRES_PASSWORD: research_papers_dev
    ports:
      - "5435:5432"
    volumes:
      - research_papers_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U research_papers -d research_papers"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  research_papers_data:
